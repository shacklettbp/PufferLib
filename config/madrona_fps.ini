[base]
package = madrona_fps
env_name = Madrona-FPS
policy_name = Policy
rnn_name = MadronaFPSLSTM

[env]
num_envs = 1024
scene_path = None
record_path = None

[train]
total_timesteps = 100_000_000_000
checkpoint_interval = 500
num_envs = 1
num_workers = 1
env_batch_size = 1
update_epochs = 1
batch_size = 491520
minibatch_size = 30720
learning_rate = 0.0002
gamma = 0.998
gae_lambda = 0.95
ent_coef = 0.001

[sweep]
method = protein
name = sweep

[sweep.metric]
goal = maximize
name = score 
min = 0
max = None

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e6
max = 1e9
mean = 1e7
scale = auto

[sweep.train.batch_size]
distribution = uniform_pow2
min = 32768
max = 131072
mean = 65536
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 1024
max = 32768
mean = 8192
scale = auto
